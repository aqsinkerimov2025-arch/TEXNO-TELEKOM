name: Deploy TEXNO-TELEKOM website

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'IMG_20260901_064742_522.jpg'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html _site/
          if [ -f IMG_20260901_064742_522.jpg ]; then cp IMG_20260901_064742_522.jpg _site/; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

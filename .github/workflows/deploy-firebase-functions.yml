name: Deploy TEXNO-TELEKOM push notifications
on:
  workflow_dispatch:
  push:
    paths:
      - "functions/**"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - run: npm install -g firebase-tools
      - run: cd functions && npm install
      - run: firebase deploy --only functions --project texno-telekom --non-interactive
<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080610">
<title>TEXNO-TELEKOM</title>
<style>
:root{--bg:#080610;--panel:#100b1b;--line:#302044;--muted:#aaa0b9;--cyan:#19a8ff;--pink:#f02fb5;--purple:#9250ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#28103b 0,transparent 48%),var(--bg);color:#f8f4ff;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{padding:28px 18px 18px;text-align:center;border-bottom:1px solid #21152e;background:#090611d9;position:sticky;top:0;z-index:3;backdrop-filter:blur(14px)}
.logo{width:66px;height:66px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:900;background:linear-gradient(135deg,#0aa9ff,#a13dff,#f02fb5);box-shadow:0 0 28px #923cff75}
h1{font-size:clamp(22px,5vw,32px);letter-spacing:2px;margin:0;font-weight:900}header p{color:var(--muted);margin:4px 0 0;font-size:13px;letter-spacing:2px}
main{max-width:980px;margin:auto;padding:20px 15px 70px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 18px}
input,select,textarea{width:100%;background:#090711;color:#fff;border:1px solid #46305d;border-radius:15px;padding:13px 15px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#b35bff;box-shadow:0 0 0 3px #a14cff20}
.search{flex:1;min-width:190px}.filter{width:auto;min-width:150px}
.actions{display:flex;gap:8px}.btn{border:0;border-radius:13px;padding:11px 15px;color:#fff;font-weight:750;background:linear-gradient(100deg,#159ff5,#a13df4,#ed35b2);cursor:pointer}
.btn.ghost{background:#171020;border:1px solid #49345e}.btn.danger{background:#4b172d;border:1px solid #8a3157}
.section-title{font-size:17px;margin:20px 0 12px;color:#e9ddff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}
.app{background:linear-gradient(145deg,#151020,#0d0915);border:1px solid #352347;border-radius:19px;padding:15px;box-shadow:0 8px 28px #0005;min-width:0}
.app-top{display:flex;gap:12px;align-items:center}.app-icon{width:54px;height:54px;flex:0 0 54px;border-radius:15px;object-fit:cover;background:#21162f;border:1px solid #51356d}
.app-icon.fallback{display:grid;place-items:center;font-size:23px;color:#d9baff}
.app h3{font-size:16px;margin:0;overflow-wrap:anywhere}.meta{color:#aa9bbd;font-size:12px;margin-top:3px}
.desc{color:#d0c7dc;font-size:13px;margin:13px 0;min-height:38px}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}.card-actions .btn{flex:1;text-align:center;text-decoration:none;font-size:13px;padding:9px}
.empty{padding:35px 15px;text-align:center;color:var(--muted);border:1px dashed #49345e;border-radius:18px}
.admin-toggle{margin-top:24px;text-align:center}.admin{display:none;margin-top:18px;background:#100b1b;border:1px solid #51336b;border-radius:20px;padding:17px}
.admin.open{display:block}.admin h2{margin:0 0 14px;font-size:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#ded2ed}
textarea{min-height:90px;resize:vertical}.hint{font-size:11px;color:#a99bb8}
.preview{width:66px;height:66px;border-radius:15px;object-fit:cover;display:none;border:1px solid #69478a}
footer{text-align:center;color:#756a83;padding:25px;font-size:12px}
@media(max-width:560px){header{padding-top:20px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.filter{flex:1}.actions{width:100%}.actions .btn{flex:1}}
</style></head>
<body>
<header><div class="logo">TT</div><h1>TEXNO-TELEKOM</h1><p>PROQRAMLAR • TEXNOLOGİYA • MƏLUMAT</p></header>
<main>
<div class="toolbar"><input id="search" class="search" placeholder="Proqram axtar..."><select id="filter" class="filter"><option value="">Bütün kateqoriyalar</option></select></div>
<div class="section-title">✦ Proqramlar</div><div id="apps" class="grid"></div>
<div class="admin-toggle"><button class="btn ghost" id="adminBtn">⚙ Admin paneli</button></div>
<section class="admin" id="admin">
<h2>Proqram əlavə et</h2>
<div class="form-grid">
<div class="field full"><label>Proqramın adı *</label><input id="name" placeholder="Məsələn: YouTube Music Premium"></div>
<div class="field full"><label>Kateqoriya *</label><input id="category" placeholder="youtube_premium"><span class="hint">Kiçik latın hərfləri, rəqəm, _ və -</span></div>
<div class="field"><label>Versiya</label><input id="version" placeholder="v1.0"></div>
<div class="field"><label>Sıra</label><input id="order" type="number" value="1"></div>
<div class="field full"><label>Təsvir</label><textarea id="description" placeholder="Proqram haqqında qısa məlumat"></textarea></div>
<div class="field full"><label>Yükləmə linki</label><input id="download" type="url" placeholder="https://..."></div>
<div class="field full"><label>İkon şəkli — qalereyadan seç</label><input id="iconFile" type="file" accept="image/png,image/jpeg,image/webp"><img id="preview" class="preview" alt="İkon önizləməsi"><span class="hint">JPG, PNG və WEBP. Bu ilkin versiyada məlumat yalnız bu brauzerdə saxlanır.</span></div>
</div>
<div class="actions" style="margin-top:14px"><button class="btn" id="save">Yadda saxla</button><button class="btn ghost" id="cancel">Təmizlə</button></div>
<p class="hint" id="notice"></p>
</section>
<p class="hint" style="text-align:center">İlkin sınaq versiyası — ümumi admin və server yaddaşı növbəti mərhələdə qoşulacaq.</p>
</main><footer>© TEXNO-TELEKOM</footer>
<script>
const $=id=>document.getElementById(id);
const KEY='tt_apps_demo_v1'; let selectedImage='', editingId=null;
const starter=[
{id:'1',name:'YouTube Music Premium',category:'youtube_premium',version:'v7.x',order:2,description:'Reklamsız musiqi və oflayn dinləmə.',download:'',icon:''},
{id:'2',name:'Telegram',category:'messaging',version:'',order:1,description:'Mesajlaşma və fayl paylaşımı.',download:'https://telegram.org/',icon:''}
];
function load(){try{return JSON.parse(localStorage.getItem(KEY))||starter}catch{return starter}}
function saveAll(a){localStorage.setItem(KEY,JSON.stringify(a))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const q=$('search').value.toLowerCase(),cat=$('filter').value;let data=load().sort((a,b)=>(+a.order||0)-(+b.order||0));
 const cats=[...new Set(data.map(x=>x.category).filter(Boolean))];$('filter').innerHTML='<option value="">Bütün kateqoriyalar</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');$('filter').value=cat;
 data=data.filter(x=>(!cat||x.category===cat)&&(`${x.name} ${x.category} ${x.description}`).toLowerCase().includes(q));
 $('apps').innerHTML=data.length?data.map(x=>`<article class="app"><div class="app-top">${x.icon?`<img class="app-icon" src="${x.icon}" alt="">`:`<div class="app-icon fallback">✦</div>`}<div><h3>${esc(x.name)}</h3><div class="meta">${esc(x.category)} ${x.version?'• '+esc(x.version):''}</div></div></div><p class="desc">${esc(x.description||'')}</p><div class="card-actions">${x.download?`<a class="btn" href="${esc(x.download)}" target="_blank" rel="noopener">Yüklə</a>`:'<span class="meta">Link əlavə edilməyib</span>'}<button class="btn ghost" onclick="editApp('${x.id}')">Redaktə</button><button class="btn danger" onclick="deleteApp('${x.id}')">Sil</button></div></article>`).join(''):'<div class="empty">Axtarışa uyğun proqram tapılmadı</div>';
}
function clearForm(){['name','category','version','description','download'].forEach(id=>$(id).value='');$('order').value=1;$('iconFile').value='';$('preview').style.display='none';selectedImage='';editingId=null;$('notice').textContent=''}
$('adminBtn').onclick=()=>$('admin').classList.toggle('open');
$('search').oninput=render;$('filter').onchange=render;
$('iconFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type)){alert('Yalnız JPG, PNG və WEBP şəkli seçin.');e.target.value='';return}if(f.size>2*1024*1024){alert('Şəkil 2 MB-dan kiçik olmalıdır.');e.target.value='';return}const r=new FileReader();r.onload=()=>{selectedImage=r.result;$('preview').src=selectedImage;$('preview').style.display='block'};r.readAsDataURL(f)};
$('save').onclick=()=>{const name=$('name').value.trim(),category=$('category').value.trim();if(!name||!category){$('notice').textContent='Proqramın adı və kateqoriya mütləqdir.';return}let all=load(),old=all.find(x=>x.id===editingId);const item={id:editingId||String(Date.now()),name,category,version:$('version').value.trim(),order:+$('order').value||1,description:$('description').value.trim(),download:$('download').value.trim(),icon:selectedImage||(old?.icon||'')};if(old)all=all.map(x=>x.id===editingId?item:x);else all.push(item);try{saveAll(all);clearForm();render();$('notice').textContent='Yadda saxlanıldı.'}catch(e){$('notice').textContent='Brauzer yaddaşı dolub. Daha kiçik ikon seçin.'}};
$('cancel').onclick=clearForm;
window.editApp=id=>{const x=load().find(a=>a.id===id);if(!x)return;editingId=id;['name','category','version','description','download','order'].forEach(k=>$(k).value=x[k]??'');selectedImage=x.icon||'';if(selectedImage){$('preview').src=selectedImage;$('preview').style.display='block'}$('admin').classList.add('open');$('notice').textContent='Redaktə rejimi'};
window.deleteApp=id=>{if(confirm('Bu proqramı silmək istəyirsiniz?')){saveAll(load().filter(x=>x.id!==id));render()}};
render();
</script></body></html>
